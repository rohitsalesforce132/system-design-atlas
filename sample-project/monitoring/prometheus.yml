global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # NebulaShop API metrics
  - job_name: "nebula-api"
    static_configs:
      - targets: ["api:5000"]
    metrics_path: /metrics

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

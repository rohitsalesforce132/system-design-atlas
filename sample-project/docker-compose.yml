version: "3.9"

# ═══════════════════════════════════════════════════════════════
# NebulaShop — Full-Stack Sample Project
# Every component from the System Design Atlas in one stack
# ═══════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────
  # INFRASTRUCTURE LAYER
  # ─────────────────────────────────────────────────────────────

  # PostgreSQL — Primary database (source of truth)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nebula
      POSTGRES_PASSWORD: nebula123
      POSTGRES_DB: nebulashop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis — Cache, rate limiter, pub/sub message bus
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Elasticsearch — Full-text search engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redpanda — Kafka-compatible streaming (lighter than Kafka, no JVM)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 1G
      - --retention-bytes 1000000000
    ports:
      - "19092:19092"
      - "18082:18082"
      - "18081:18081"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep 'HEALTHY' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO — S3-compatible object storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # APPLICATION LAYER
  # ─────────────────────────────────────────────────────────────

  # API Server — Flask REST API
  api:
    build: ./api
    environment:
      POSTGRES_URL: postgresql://nebula:nebula123@postgres:5432/nebulashop
      REDIS_URL: redis://redis:6379
      ES_URL: http://elasticsearch:9200
      KAFKA_BROKERS: redpanda:9092
      MINIO_URL: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Worker — Kafka consumer (indexes to ES, sends notifications)
  worker:
    build: ./worker
    environment:
      POSTGRES_URL: postgresql://nebula:nebula123@postgres:5432/nebulashop
      REDIS_URL: redis://redis:6379
      ES_URL: http://elasticsearch:9200
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      api:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # Realtime Server — WebSocket + Redis Pub/Sub
  realtime:
    build: ./realtime
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8765:8765"
    depends_on:
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────
  # EDGE / PROXY LAYER
  # ─────────────────────────────────────────────────────────────

  # Nginx — Load Balancer + Reverse Proxy + Static Files
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/static:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_started

  # ─────────────────────────────────────────────────────────────
  # MONITORING LAYER
  # ─────────────────────────────────────────────────────────────

  # Prometheus — Metrics collection
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  # Grafana — Dashboards
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

# ═══════════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════════
volumes:
  postgres_data:
  redis_data:
  es_data:
  redpanda_data:
  minio_data:
  prometheus_data:
  grafana_data:
